[project]
name = "ae-netscope-api"
version = "0.2.0a1"
description = "API foundation for AE NetScope."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.19.1",
  "aiosqlite>=0.22.1",
  "asyncpg>=0.31.0",
  "cryptography>=50.0.1",
  "fastapi>=0.141.1",
  "psycopg[binary]>=3.3.5",
  "pwdlib[argon2]>=0.3.1",
  "pydantic-settings>=2.15.0",
  "email-validator>=2.3.0",
  "redis>=8.1.0",
  "starlette>=1.6.0",
  "sqlalchemy>=2.0.52",
  "uvicorn[standard]>=0.52.4",
  "webauthn>=3.0.0",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "msgpack>=1.2.2",
  "pip-audit>=2.10.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.5",
]
worker = [
  "dramatiq[redis]>=2.2.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
